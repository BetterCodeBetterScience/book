# Deploys a static redirect to the canonical book site.
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: GitHub Pages Redirect
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Create redirect page
        run: |
          mkdir -p ./_site
          cat > ./_site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://bettercodebetterscience.github.io/bettercode/">
            <link rel="canonical" href="https://bettercodebetterscience.github.io/bettercode/">
            <title>Redirecting…</title>
          </head>
          <body>
            <p>This site has moved. Redirecting to
              <a href="https://bettercodebetterscience.github.io/bettercode/">https://bettercodebetterscience.github.io/bettercode/</a>…</p>
          </body>
          </html>
          EOF
          # Serve the same redirect for unknown paths so deep links also forward.
          cp ./_site/index.html ./_site/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
